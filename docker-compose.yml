services:
  app:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/books
      SEED_ON_STARTUP: 'true'
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0.32
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
